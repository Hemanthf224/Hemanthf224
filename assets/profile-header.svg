  <text x="42" y="148" fill="#f8fafc" font-size="46" font-weight="700">Algorithms to applications.</text>
  <text x="44" y="184" fill="#cbd5e1" font-size="20">Build thoughtfully. Measure carefully. Keep learning.</text>
