<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
<title id="title">Algorithms to applications</title>
<desc id="desc">Hemanth's focus: graph systems, data pipelines, and applied machine learning. A connected graph illustrates the path from ideas to working systems.</desc>
