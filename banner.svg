<svg width="800" height="250" viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="250" fill="#0d1117" />
  
  <!-- Subtle Dot Pattern -->
  <defs>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#161b22" />
    </pattern>
    
    <!-- Neon Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="250" fill="url(#dots)" />
  
  <!-- Outer glowing brackets -->
  <path d="M 50 30 L 30 30 L 30 220 L 50 220" fill="none" stroke="#00E5FF" stroke-width="3" filter="url(#glow-cyan)" />
  <path d="M 750 30 L 770 30 L 770 220 L 750 220" fill="none" stroke="#FF007F" stroke-width="3" filter="url(#glow-pink)" />
  
  <!-- ONLINE Indicator -->
  <circle cx="680" cy="50" r="5" fill="#00FF00" filter="url(#glow-cyan)" />
  <text x="695" y="55" font-family="monospace" font-size="12" fill="#00FF00" font-weight="bold" letter-spacing="2">ONLINE</text>
  
  <!-- Main Name -->
  <text x="80" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="64" fill="#FFFFFF" font-weight="900" letter-spacing="4">
    HEMANTH <tspan fill="#00E5FF" filter="url(#glow-cyan)">REDDY</tspan>
  </text>
  
  <!-- Pink Underline accent -->
  <line x1="80" y1="135" x2="280" y2="135" stroke="#FF007F" stroke-width="4" filter="url(#glow-pink)" />
  
  <!-- Subtitle -->
  <text x="80" y="175" font-family="monospace" font-size="16" fill="#8b949e" letter-spacing="3">
    AI SYSTEMS <tspan fill="#FF007F">x</tspan> DATA SCIENCE <tspan fill="#FF007F">x</tspan> HIGH PERF
  </text>
  
  <!-- Terminal Command line -->
  <text x="80" y="215" font-family="monospace" font-size="14" fill="#484f58">
    root@amrita:~$ <tspan fill="#00E5FF">systemctl status hemanth --live</tspan>
  </text>
</svg>
